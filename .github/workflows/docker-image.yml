name: Build and Push Dashboard

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: chillbilly90/recurse-dashboard:arm64
          build-args: |
            NEXT_PUBLIC_NODE_1_IP=${{ secrets.NEXT_PUBLIC_NODE_1_IP }}
            NEXT_PUBLIC_NODE_2_IP=${{ secrets.NEXT_PUBLIC_NODE_2_IP }}
            NEXT_PUBLIC_NODE_3_IP=${{ secrets.NEXT_PUBLIC_NODE_3_IP }}
            NEXT_PUBLIC_NODE_4_IP=${{ secrets.NEXT_PUBLIC_NODE_4_IP }}
            NEXT_PUBLIC_NODE_5_IP=${{ secrets.NEXT_PUBLIC_NODE_5_IP }}
            NEXT_PUBLIC_NODE_6_IP=${{ secrets.NEXT_PUBLIC_NODE_6_IP }}
            NEXT_PUBLIC_GRAFANA_BASE=${{ secrets.NEXT_PUBLIC_GRAFANA_BASE }}
            NEXT_PUBLIC_GRAFANA_DASHBOARD_UID=${{ secrets.NEXT_PUBLIC_GRAFANA_DASHBOARD_UID }}
            NEXT_PUBLIC_GRAFANA_DASHBOARD_SLUG=${{ secrets.NEXT_PUBLIC_GRAFANA_DASHBOARD_SLUG }}
            NEXT_PUBLIC_GRAFANA_ORG_ID=${{ secrets.NEXT_PUBLIC_GRAFANA_ORG_ID }}
            NEXT_PUBLIC_GRAFANA_DATASOURCE=${{ secrets.NEXT_PUBLIC_GRAFANA_DATASOURCE }}
            NEXT_PUBLIC_GRAFANA_CLUSTER=${{ secrets.NEXT_PUBLIC_GRAFANA_CLUSTER }}
            NEXT_PUBLIC_GRAFANA_FROM=${{ secrets.NEXT_PUBLIC_GRAFANA_FROM }}
            NEXT_PUBLIC_GRAFANA_TO=${{ secrets.NEXT_PUBLIC_GRAFANA_TO }}
            NEXT_PUBLIC_GRAFANA_TIMEZONE=${{ secrets.NEXT_PUBLIC_GRAFANA_TIMEZONE }}
            NEXT_PUBLIC_GRAFANA_REFRESH=${{ secrets.NEXT_PUBLIC_GRAFANA_REFRESH }}
            NEXT_PUBLIC_GRAFANA_FEATURE_DASHBOARD_SCENE=${{ secrets.NEXT_PUBLIC_GRAFANA_FEATURE_DASHBOARD_SCENE }}